# RT tests, arm A — the five-rung RT ladder on data that carries IOP truth.
#
# One IOP parameterization (`expb_pow`: ExpBricaud + Pow) held fixed while the
# radiative transfer is varied five ways, so any difference between two rows is
# the RT and nothing else. The rungs are registered by
# `ioptics.algorithms.registry.register_rt_variants()`, which the build script
# calls before this config's algorithm names are resolved — they are opt-in and
# are NOT in the standard seed.
#
#   expb_pow_ztt_el          robust_ztt, elastic          (analytic robust RT)
#   expb_pow_hyb_el          robust_hybrid, elastic       (+ learned emulator)
#   expb_pow_hyb_ram         robust_hybrid + Raman
#   expb_pow_hyb_ramfl       ... + chlorophyll fluorescence
#   expb_pow_hyb_ramflcdom   ... + CDOM fluorescence      (the full stack)
#
# All five fit `B_p` (the robust forward models' phase-function parameter) as a
# free trailing parameter, so k = 6, not 5. That matters here — see the PANGAEA
# note below.
sweep_id: rt_tests_A_v1
datasets: [L23, PANGAEA]

dataset_opts:
  L23: {X: 4}                  # the INELASTIC HydroLight realization. X=1 has no
                               #   Raman and no fluorescence in the truth at all,
                               #   so rungs 3-5 would be testing for a signal the
                               #   data-generating model never put there.

noise_model: pace              # ONE noise model per sweep (config schema), so a
                               #   mixed L23+PANGAEA run must pick one. `pace` is
                               #   L23's own convention (every expb_giop sweep uses
                               #   it) and it is an ABSOLUTE per-band error, which
                               #   is what keeps the few-percent inelastic features
                               #   this sweep exists to detect above the noise. The
                               #   alternative for the PANGAEA arm, `insitu`, is not
                               #   more measured — PANGAEA V3 ships no per-band Rrs
                               #   uncertainty at all, so it degrades to an invented
                               #   flat 10% (prep._INSITU_PCT_FALLBACK) — it is only
                               #   wider. multi_v2 faced the same choice and took a
                               #   uniform `pct:0.05`. OPEN QUESTION for JXP: if the
                               #   PANGAEA numbers are to be quoted on their own,
                               #   split this into two sweeps (L23@pace,
                               #   PANGAEA@insitu) and fold both.
seed: 20260907                 # noise draw + per-record MCMC walker seeding
                               #   (run._record_seed). Fixed: it is what makes the
                               #   chi-squared weights and the chains reproducible.

algorithms:                    # the RT ladder, in order (bare names: no overrides)
  - expb_pow_ztt_el
  - expb_pow_hyb_el
  - expb_pow_hyb_ram
  - expb_pow_hyb_ramfl
  - expb_pow_hyb_ramflcdom

fit_method: mcmc               # sweep-level. `run_sweep` chi-squared-fits EVERY
                               #   record for every algorithm regardless; this
                               #   additionally opts all five into the MCMC pass.
mcmc_subset: 3417              # ALL of them: 3320 L23 (X=4) + 97 PANGAEA.
                               #   `run_sweep` takes `records[:mcmc_subset]`, so any
                               #   value >= 3417 means "all"; it is written exactly
                               #   so the intent is legible in provenance.

wv_min: 400                    # 400-750 nm: inside robust_hybrid's 350-750 nm
wv_max: 750                    #   emulator training domain, and blueward of 400 nm
                               #   the Raman excitation wavelengths fall off the
                               #   water tables.

leaderboard: false             # NOT a cross-algorithm standing. These five rows are
                               #   one algorithm under five physics packages, not
                               #   five competing retrievals, and folding them would
                               #   put five near-clones of expb_pow on the board.

# PANGAEA population — read this before quoting the PANGAEA arm.
# The 97 ids come from `pangaea97_ids.csv` (frozen; see derive_pangaea97.py) and
# are applied by the build script's `bounded_obs_ids()`. They are the NOMAD
# observations carrying aph AND acdom AND bbp truth — but NOMAD is a multispectral
# compilation: 72 of the 97 have only 6 usable bands and 2 have 5. With a free B_p
# the model has k = 6 free parameters, and `run._refuse_underdetermined` declines
# n_bands <= k, so **74 of the 97 return `fit_failed` (underdetermined) by
# construction** and the scorable PANGAEA population is the 25 eleven-band
# `nomad_rb-01-02` spectra. That is a property of the data, not a bug, and it is
# stated here rather than discovered in the metrics table.
