sweep_id: expb_giop_L23_v1
datasets: [L23]
noise_model: pace
algorithms:
  - name: expb_pow       # standard 5-param BING — MCMC on the subset (1d)
    fit_method: mcmc     #   (still χ²-fit over all records, like every algo)
  - giop                 # LM/χ² only — not MCMC-fit (1b)
fit_method: chisq        # sweep default (applies to giop)
mcmc_subset: 200         # spectra expb_pow also fits with MCMC (D4)
seed: 1234
